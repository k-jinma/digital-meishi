<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>名刺の受け取り</title>
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 id="heading">名刺の受け取り</h1>
    <p>アプリのインストール・登録は不要です</p>
  </header>

  <div class="card-area">
    <canvas id="card" class="card-preview" aria-label="受け取った名刺"></canvas>
  </div>

  <h2 class="section-title">保存方法を選択</h2>
  <div role="group" aria-label="保存方法">
    <button type="button" class="row-btn" data-save="png">
      <span class="format-box" aria-hidden="true">PNG</span>
      <span class="text">
        <span class="title">画像で保存</span>
        <span class="desc">写真アプリに保存します。あとから見返しやすい形式です。</span>
      </span>
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="#5A6270" stroke-width="1.6"/></svg>
    </button>
    <button type="button" class="row-btn" data-save="pdf">
      <span class="format-box" aria-hidden="true">PDF</span>
      <span class="text">
        <span class="title">PDFで保存</span>
        <span class="desc">ファイルアプリに保存します。電話番号・メールはタップで利用でき、連絡先データ（vCard）を同梱しています。</span>
      </span>
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="#5A6270" stroke-width="1.6"/></svg>
    </button>
    <button type="button" class="row-btn" data-save="vcf">
      <span class="format-box" aria-hidden="true">VCF</span>
      <span class="text">
        <span class="title">連絡先に追加</span>
        <span class="desc">スマートフォンの連絡先に登録します。</span>
      </span>
      <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="#5A6270" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div class="block" style="padding-top:0;padding-bottom:0"><p id="status" class="status" role="status"></p></div>

  <h2 class="section-title">保存されるファイル名</h2>
  <div class="block">
    <p class="caption">会社名_氏名_保存日</p>
    <div id="file-name" style="word-break:break-all"></div>
  </div>

  <div class="notice-area">
    <p class="notice">この名刺のデータはURLの「#」以降にのみ含まれ、サーバーには送信・保存されません。保存したファイルはお使いの端末内にのみ残ります。</p>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/meishi.js"></script>
<script src="js/receiver.js"></script>
</body>
</html>
